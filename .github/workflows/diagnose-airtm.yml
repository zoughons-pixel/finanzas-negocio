name: Diagnose Airtm

on:
  push:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test Airtm converter page
        shell: bash
        run: |
          set -o pipefail
          echo '=== MAIN CONVERTER ==='
          curl -L --max-time 25 -sS \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -D /tmp/h1.txt \
            -o /tmp/b1.html \
            -w 'HTTP=%{http_code} URL=%{url_effective} SIZE=%{size_download}\n' \
            'https://www.airtm.com/en/currency-converter/ves-to-usd/' || true
          sed -n '1,25p' /tmp/h1.txt || true
          echo '--- rate matches ---'
          grep -Eo -i 'Net rate.{0,160}|1[[:space:]]*(USD|USDC)[[:space:]]*=[[:space:]]*[0-9.,]+[[:space:]]*VES' /tmp/b1.html | head -20 || true
          echo '--- interesting tokens ---'
          grep -Eo -i 'cloudflare|captcha|challenge|access denied|forbidden|980\.[0-9]+|[0-9]{3,4}\.[0-9]{2}[[:space:]]*VES' /tmp/b1.html | head -30 || true

          echo '=== RATES ROOT ==='
          curl -L --max-time 20 -sS -D /tmp/h2.txt -o /tmp/b2.txt -w 'HTTP=%{http_code} URL=%{url_effective} SIZE=%{size_download}\n' 'https://rates.airtm.io/' || true
          sed -n '1,25p' /tmp/h2.txt || true
          echo 'BODY:'
          head -c 4000 /tmp/b2.txt || true
          echo

          echo '=== RATES /en ==='
          curl -L --max-time 20 -sS -D /tmp/h3.txt -o /tmp/b3.txt -w 'HTTP=%{http_code} URL=%{url_effective} SIZE=%{size_download}\n' 'https://rates.airtm.io/en' || true
          sed -n '1,25p' /tmp/h3.txt || true
          echo 'BODY:'
          head -c 4000 /tmp/b3.txt || true
          echo
