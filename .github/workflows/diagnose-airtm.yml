name: Diagnose Airtm

on:
  push:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Airtm VES rate feed
        shell: bash
        run: |
          set -e
          curl -L --max-time 20 -sS 'https://rates.airtm.io/' -o /tmp/rates.json
          echo '=== ves/usd ==='
          jq '.data["ves/usd"]' /tmp/rates.json
          echo '=== keys containing ves ==='
          jq -r '.data | to_entries[] | select(.key | contains("ves")) | "\(.key)=\(.value)"' /tmp/rates.json
